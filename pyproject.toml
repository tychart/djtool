[project]
name = "djtool"
version = "0.1.0"
description = "Manage a DJ music collection: duplicate review, Incoming ingestion, rsync sync"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mutagen>=1.47",
    "rapidfuzz>=3.0",
]

[project.scripts]
djtool = "djtool.core:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/djtool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
